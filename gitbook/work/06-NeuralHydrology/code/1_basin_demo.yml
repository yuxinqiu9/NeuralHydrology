# ──────────────────────────────────────────────────────────────────────────────
# NeuralHydrology config — Single basin LSTM demo
# Basin: 01013500 (Fish River near Fort Kent, Maine)
# Topic: Neural Hydrology, SoSe 2026 Seminar
# ──────────────────────────────────────────────────────────────────────────────

experiment_name: fish_river_ea_lstm

# Basin list files (relative to this config or absolute)
train_basin_file: 1_basin.txt
validation_basin_file: 1_basin.txt
test_basin_file: 1_basin.txt

# Training/validation/test periods
train_start_date: "01/10/1999"
train_end_date: "30/09/2008"
validation_start_date: "01/10/1980"
validation_end_date: "30/09/1989"
test_start_date: "01/10/1989"
test_end_date: "30/09/1999"

# Hardware
device: cuda:0  # change to "cpu" if no GPU

# Validation
validate_every: 3
validate_n_random_basins: 1
metrics:
  - NSE
  - KGE

# ─── Model ────────────────────────────────────────────────────────────────────
model: ealstm         # Entity-Aware LSTM (conditions input gate on static attrs)
head: regression
output_activation: linear
hidden_size: 256
initial_forget_bias: 3
output_dropout: 0.4

# ─── Training ─────────────────────────────────────────────────────────────────
optimizer: Adam
loss: NSE
learning_rate:
  0: 1e-3
  20: 5e-4
  30: 1e-4
batch_size: 256
epochs: 30
clip_gradient_norm: 1
predict_last_n: 1
seq_length: 365
num_workers: 4
log_interval: 5
log_tensorboard: false
log_n_figures: 1
save_weights_every: 1

# ─── Data ─────────────────────────────────────────────────────────────────────
dataset: camels_us
data_dir: ../../data/CAMELS_US   # adjust to actual path

forcings:
  - daymet
  - nldas

dynamic_inputs:
  - PRCP(mm/day)_nldas
  - PRCP(mm/day)_maurer
  - prcp(mm/day)_daymet
  - srad(W/m2)_daymet
  - tmax(C)_daymet
  - tmin(C)_daymet
  - vp(Pa)_daymet

static_attributes:
  - elev_mean
  - slope_mean
  - area_gages2
  - frac_forest
  - lai_max
  - lai_diff
  - gvf_max
  - gvf_diff
  - soil_depth_pelletier
  - soil_porosity
  - soil_conductivity
  - max_water_content
  - sand_frac
  - silt_frac
  - clay_frac
  - water_frac
  - organic_frac
  - p_mean
  - pet_mean
  - aridity
  - frac_snow
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur

target_variables:
  - QObs(mm/d)

clip_targets_to_zero:
  - QObs(mm/d)
